<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Row 0: head top -->
  <rect x="60"  y="0"   width="200" height="20" fill="#2b1800"/>

  <!-- Row 1 -->
  <rect x="40"  y="20"  width="20"  height="20" fill="#2b1800"/>
  <rect x="60"  y="20"  width="200" height="20" fill="#6b3510"/>
  <rect x="260" y="20"  width="20"  height="20" fill="#2b1800"/>

  <!-- Row 2 -->
  <rect x="20"  y="40"  width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="40"  width="40"  height="20" fill="#6b3510"/>
  <rect x="80"  y="40"  width="160" height="20" fill="#8b4f28"/>
  <rect x="240" y="40"  width="40"  height="20" fill="#6b3510"/>
  <rect x="280" y="40"  width="20"  height="20" fill="#2b1800"/>

  <!-- Row 3 -->
  <rect x="20"  y="60"  width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="60"  width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="60"  width="40"  height="20" fill="#8b4f28"/>
  <rect x="100" y="60"  width="120" height="20" fill="#b07040"/>
  <rect x="220" y="60"  width="40"  height="20" fill="#8b4f28"/>
  <rect x="260" y="60"  width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="60"  width="20"  height="20" fill="#2b1800"/>

  <!-- Row 4: eyes -->
  <rect x="20"  y="80"  width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="80"  width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="80"  width="20"  height="20" fill="#8b4f28"/>
  <rect x="80"  y="80"  width="20"  height="20" fill="#b07040"/>
  <rect x="100" y="80"  width="20"  height="20" fill="#101010"/>
  <rect x="120" y="80"  width="80"  height="20" fill="#b07040"/>
  <rect x="200" y="80"  width="20"  height="20" fill="#101010"/>
  <rect x="220" y="80"  width="20"  height="20" fill="#b07040"/>
  <rect x="240" y="80"  width="20"  height="20" fill="#8b4f28"/>
  <rect x="260" y="80"  width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="80"  width="20"  height="20" fill="#2b1800"/>

  <!-- Row 5 -->
  <rect x="20"  y="100" width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="100" width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="100" width="20"  height="20" fill="#8b4f28"/>
  <rect x="80"  y="100" width="160" height="20" fill="#b07040"/>
  <rect x="240" y="100" width="20"  height="20" fill="#8b4f28"/>
  <rect x="260" y="100" width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="100" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 6: nose top -->
  <rect x="20"  y="120" width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="120" width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="120" width="20"  height="20" fill="#8b4f28"/>
  <rect x="80"  y="120" width="40"  height="20" fill="#b07040"/>
  <rect x="120" y="120" width="80"  height="20" fill="#e85570"/>
  <rect x="200" y="120" width="40"  height="20" fill="#b07040"/>
  <rect x="240" y="120" width="20"  height="20" fill="#8b4f28"/>
  <rect x="260" y="120" width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="120" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 7: nose middle -->
  <rect x="20"  y="140" width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="140" width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="140" width="20"  height="20" fill="#8b4f28"/>
  <rect x="80"  y="140" width="20"  height="20" fill="#b07040"/>
  <rect x="100" y="140" width="40"  height="20" fill="#e85570"/>
  <rect x="140" y="140" width="40"  height="20" fill="#c02050"/>
  <rect x="180" y="140" width="40"  height="20" fill="#e85570"/>
  <rect x="220" y="140" width="20"  height="20" fill="#b07040"/>
  <rect x="240" y="140" width="20"  height="20" fill="#8b4f28"/>
  <rect x="260" y="140" width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="140" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 8: nose bottom (mirror of row 6) -->
  <rect x="20"  y="160" width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="160" width="20"  height="20" fill="#6b3510"/>
  <rect x="60"  y="160" width="20"  height="20" fill="#8b4f28"/>
  <rect x="80"  y="160" width="40"  height="20" fill="#b07040"/>
  <rect x="120" y="160" width="80"  height="20" fill="#e85570"/>
  <rect x="200" y="160" width="40"  height="20" fill="#b07040"/>
  <rect x="240" y="160" width="20"  height="20" fill="#8b4f28"/>
  <rect x="260" y="160" width="20"  height="20" fill="#6b3510"/>
  <rect x="280" y="160" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 9: chin -->
  <rect x="20"  y="180" width="20"  height="20" fill="#2b1800"/>
  <rect x="40"  y="180" width="40"  height="20" fill="#6b3510"/>
  <rect x="80"  y="180" width="40"  height="20" fill="#8b4f28"/>
  <rect x="120" y="180" width="80"  height="20" fill="#b07040"/>
  <rect x="200" y="180" width="40"  height="20" fill="#8b4f28"/>
  <rect x="240" y="180" width="40"  height="20" fill="#6b3510"/>
  <rect x="280" y="180" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 10: lower head -->
  <rect x="40"  y="200" width="20"  height="20" fill="#2b1800"/>
  <rect x="60"  y="200" width="40"  height="20" fill="#6b3510"/>
  <rect x="100" y="200" width="120" height="20" fill="#8b4f28"/>
  <rect x="220" y="200" width="40"  height="20" fill="#6b3510"/>
  <rect x="260" y="200" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 11: shoulders (full width) -->
  <rect x="0"   y="220" width="20"  height="20" fill="#2b1800"/>
  <rect x="20"  y="220" width="280" height="20" fill="#6b3510"/>
  <rect x="300" y="220" width="20"  height="20" fill="#2b1800"/>

  <!-- Row 12: paws begin -->
  <rect x="0"   y="240" width="40"  height="20" fill="#f0a868"/>
  <rect x="40"  y="240" width="240" height="20" fill="#6b3510"/>
  <rect x="280" y="240" width="40"  height="20" fill="#f0a868"/>

  <!-- Row 13: paws wider -->
  <rect x="0"   y="260" width="60"  height="20" fill="#f0a868"/>
  <rect x="60"  y="260" width="200" height="20" fill="#6b3510"/>
  <rect x="260" y="260" width="60"  height="20" fill="#f0a868"/>

  <!-- Row 14: claws -->
  <rect x="20"  y="280" width="60"  height="20" fill="#c88c40"/>
  <rect x="240" y="280" width="60"  height="20" fill="#c88c40"/>

  <!-- Row 15: claw tips -->
  <rect x="40"  y="300" width="40"  height="20" fill="#c88c40"/>
  <rect x="240" y="300" width="40"  height="20" fill="#c88c40"/>
</svg>
