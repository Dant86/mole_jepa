[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mole_jepa"]

[project]
name = "mole-jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv",
    "torch",
    "torchvision",
    "plotly",
    "datasets",
    "webdataset",
    "Pillow",
    "scipy",
    "transformers",
    "jupyterlab",
    "wandb",
    "supabase>=2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]
data = [
    # Used by prepare_datacomp: metadata filtering and image download.
    "huggingface_hub>=0.23",  # HfFileSystem for direct parquet streaming
    "img2dataset>=1.41",
    "imghdr",  # vendored shim — see vendor/imghdr/ (removed from stdlib in Py 3.13)
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[tool.uv.sources]
# imghdr was removed from the Python stdlib in 3.13 (PEP 594) and has no
# maintained PyPI release.  Use the vendored shim instead.
imghdr = { path = "vendor/imghdr" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mole_jepa --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@abc.abstractmethod",
]
omit = []

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "D",  # pydocstyle (Google convention)
    "UP", # pyupgrade
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Google style puts __init__ args in the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # No docstrings required in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["mole_jepa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false  # torch doesn't declare its public API in __all__
